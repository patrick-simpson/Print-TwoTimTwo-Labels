<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Feature Ideas — scratchpad</title>
    <meta name="description" content="Private scratchpad of feature ideas for the Awana label printer and check-in display. Tick the ones you like and copy a build prompt." />
    <link rel="icon" type="image/png" href="/icon128.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
            colors: {
              brand: {
                50:  '#f0fdf4', 100: '#dcfce7', 200: '#bbf7d0',
                500: '#22c55e', 600: '#16a34a', 700: '#15803d', 900: '#14532d',
              },
            },
          },
        },
      }
    </script>
    <style>
      html { scroll-behavior: smooth; }
      /* Room at the bottom so the sticky bar never covers the last row. */
      body { padding-bottom: 92px; }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased font-sans">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200">
      <div class="max-w-4xl mx-auto px-5 py-6">
        <div class="flex items-center gap-2 text-xs font-semibold text-slate-400 uppercase tracking-wide">
          <span>Private scratchpad</span>
          <span class="text-slate-300">•</span>
          <span>unlisted</span>
        </div>
        <h1 class="text-2xl sm:text-3xl font-black text-slate-900 mt-1">Feature Ideas</h1>
        <p class="text-sm text-slate-500 mt-1">
          100 candidate features across both apps. Tick the ones you want, then copy a build prompt for exactly those.
        </p>
        <p class="text-xs text-slate-400 mt-2">
          Note: your ticks live only in this tab and reset if you reload — copy the prompt before you close it.
        </p>

        <!-- Filters -->
        <div class="mt-4 flex flex-wrap items-center gap-2">
          <div id="filter-chips" class="flex flex-wrap gap-1.5">
            <button data-filter="all"     class="chip chip-active">All <span class="chip-count" data-count="all"></span></button>
            <button data-filter="P"       class="chip">Printer <span class="chip-count" data-count="P"></span></button>
            <button data-filter="D"       class="chip">Display <span class="chip-count" data-count="D"></span></button>
            <button data-filter="B"       class="chip">Both <span class="chip-count" data-count="B"></span></button>
          </div>
          <div class="flex-1 min-w-[160px]">
            <input id="search" type="search" placeholder="Search ideas…"
              class="w-full px-3 py-1.5 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500/40 focus:border-brand-500" />
          </div>
        </div>

        <!-- Helpers -->
        <div class="mt-3 flex flex-wrap items-center gap-3 text-xs">
          <button id="select-visible" class="font-semibold text-brand-700 hover:text-brand-900">Select all (visible)</button>
          <button id="clear-all" class="font-semibold text-slate-500 hover:text-slate-800">Clear</button>
          <span id="empty-note" class="text-slate-400"></span>
        </div>
      </div>
    </header>

    <!-- List -->
    <main id="list" class="max-w-4xl mx-auto px-5 py-6 space-y-6"></main>

    <!-- Sticky action bar -->
    <div class="fixed bottom-0 inset-x-0 bg-white/95 backdrop-blur border-t border-slate-200">
      <div class="max-w-4xl mx-auto px-5 py-3 flex items-center gap-3">
        <div class="text-sm text-slate-600">
          <span id="selected-count" class="font-bold text-slate-900">0</span> of 100 selected
        </div>
        <div class="flex-1"></div>
        <button id="copy-btn"
          class="px-4 py-2 rounded-lg text-sm font-bold bg-brand-600 text-white hover:bg-brand-700 disabled:opacity-40 disabled:cursor-not-allowed transition-colors">
          Copy build prompt
        </button>
      </div>
    </div>

    <style>
      .chip { padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
              background: #f1f5f9; color: #475569; border: 1px solid transparent; cursor: pointer; }
      .chip:hover { background: #e2e8f0; }
      .chip-active { background: #dcfce7; color: #15803d; border-color: #bbf7d0; }
      .chip-count { opacity: 0.6; font-weight: 700; }
      .tag { display: inline-block; min-width: 20px; text-align: center; font-size: 10px; font-weight: 800;
             padding: 2px 6px; border-radius: 5px; line-height: 1.3; }
      .tag-P { background: #dcfce7; color: #15803d; }
      .tag-D { background: #ede9fe; color: #6d28d9; }
      .tag-B { background: #fef3c7; color: #92400e; }
      .idea-row { display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
      .idea-row:hover { background: #f8fafc; }
      .idea-row input { margin-top: 3px; width: 16px; height: 16px; accent-color: #16a34a; cursor: pointer; flex-shrink: 0; }
      .idea-row.checked { background: #f0fdf4; }
    </style>

    <script>
      // ── The ideas. Self-contained; no fetch, no external file. ──────────────
      // app: 'P' printer · 'D' display · 'B' both.
      var IDEAS = [
        // Labels & printing — Printer
        { n: 1,  app: 'P', cat: 'Labels & printing', title: 'Visual label-template editor (drag fields, save layouts per club)' },
        { n: 2,  app: 'P', cat: 'Labels & printing', title: 'Multiple label sizes (2×1, 3×2, 4×3) selectable per printer' },
        { n: 3,  app: 'P', cat: 'Labels & printing', title: "QR code on the label linking to the child's checkout record" },
        { n: 4,  app: 'P', cat: 'Labels & printing', title: 'Scannable barcode for fast, keyboard-free checkout' },
        { n: 5,  app: 'P', cat: 'Labels & printing', title: 'Optional child photo on the label, gated on photo-release consent' },
        { n: 6,  app: 'P', cat: 'Labels & printing', title: 'Allergy severity color-coding (red = anaphylaxis, amber = mild)' },
        { n: 7,  app: 'P', cat: 'Labels & printing', title: 'Custom allergy icon set the church can edit' },
        { n: 8,  app: 'P', cat: 'Labels & printing', title: 'Configurable label footer (church name, a verse, service times)' },
        { n: 9,  app: 'P', cat: 'Labels & printing', title: 'Parent-pickup tag that prints the checkout security code to match' },
        { n: 10, app: 'P', cat: 'Labels & printing', title: 'Connect-card second label auto-printed for first-time visitors' },
        { n: 11, app: 'P', cat: 'Labels & printing', title: 'Handbook-completion progress shown on the label' },
        { n: 12, app: 'P', cat: 'Labels & printing', title: 'Share-balance / store-credit line on store nights' },
        { n: 13, app: 'P', cat: 'Labels & printing', title: '"Go to: <room>" late-arrival routing shown more prominently' },
        { n: 14, app: 'P', cat: 'Labels & printing', title: 'Name pronunciation guide field printed under the name' },

        // Print server & reliability — Printer
        { n: 15, app: 'P', cat: 'Print server & reliability', title: 'Offline print queue that flushes automatically when the printer returns' },
        { n: 16, app: 'P', cat: 'Print server & reliability', title: 'Multi-printer routing by club (Cubbies → front, T&T → gym)' },
        { n: 17, app: 'P', cat: 'Print server & reliability', title: 'Printer health polling with low-paper / offline warnings' },
        { n: 18, app: 'P', cat: 'Print server & reliability', title: 'Scheduled morning auto test-print to catch a dead printer early' },
        { n: 19, app: 'P', cat: 'Print server & reliability', title: 'Configurable duplicate-suppression window in the dashboard' },
        { n: 20, app: 'P', cat: 'Print server & reliability', title: 'Undo-last-print button' },
        { n: 21, app: 'P', cat: 'Print server & reliability', title: 'Print-history full-text search and date filtering' },
        { n: 22, app: 'P', cat: 'Print server & reliability', title: 'Auto-update channel selector (stable vs beta)' },
        { n: 23, app: 'P', cat: 'Print server & reliability', title: 'Cloud backup / restore of config and schedule' },
        { n: 24, app: 'P', cat: 'Print server & reliability', title: 'Multi-campus config profiles switchable from the tray' },
        { n: 25, app: 'P', cat: 'Print server & reliability', title: 'Paper/label cost tracker with a monthly total' },

        // Dashboard & operations — Printer
        { n: 26, app: 'P', cat: 'Dashboard & operations', title: 'Dark mode for the dashboard' },
        { n: 27, app: 'P', cat: 'Dashboard & operations', title: 'Mobile-responsive dashboard layout for phones at the door' },
        { n: 28, app: 'P', cat: 'Dashboard & operations', title: 'Attendance analytics: per-club trends across weeks' },
        { n: 29, app: 'P', cat: 'Dashboard & operations', title: 'Export attendance to Planning Center / other ChMS' },
        { n: 30, app: 'P', cat: 'Dashboard & operations', title: 'Birthday list for the month, exportable' },
        { n: 31, app: 'P', cat: 'Dashboard & operations', title: 'First-timer follow-up list for the connect team' },
        { n: 32, app: 'P', cat: 'Dashboard & operations', title: 'Allergy roster print for the snack/kitchen team' },
        { n: 33, app: 'P', cat: 'Dashboard & operations', title: '"No photo" kids quick roster for volunteers' },
        { n: 34, app: 'P', cat: 'Dashboard & operations', title: 'Whole-family / sibling-group print in one action' },
        { n: 35, app: 'P', cat: 'Dashboard & operations', title: 'Weekly email summary to the director' },
        { n: 36, app: 'P', cat: 'Dashboard & operations', title: 'Slack / Discord webhook on milestones and failures' },
        { n: 37, app: 'P', cat: 'Dashboard & operations', title: 'PIN-protect settings changes on the dashboard' },
        { n: 38, app: 'P', cat: 'Dashboard & operations', title: 'Kiosk lock mode to prevent tampering at the station' },
        { n: 39, app: 'P', cat: 'Dashboard & operations', title: 'Chime / sound on a successful print' },
        { n: 40, app: 'P', cat: 'Dashboard & operations', title: 'Spoken name announce on check-in (accessibility)' },

        // Check-in flow — Printer
        { n: 41, app: 'P', cat: 'Check-in flow', title: 'Self-check-in tablet kiosk mode at the door' },
        { n: 42, app: 'P', cat: 'Check-in flow', title: 'Guest pre-registration link families fill out ahead of time' },
        { n: 43, app: 'P', cat: 'Check-in flow', title: 'Walk-in visitor register + label in one step, label always wins' },
        { n: 44, app: 'P', cat: 'Check-in flow', title: 'Step-up-night automation (auto-advance clubs on the roster)' },
        { n: 45, app: 'P', cat: 'Check-in flow', title: 'Points / scoreboard integration on the label or dashboard' },
        { n: 46, app: 'P', cat: 'Check-in flow', title: 'Roster import wizard (KidCheck / arbitrary CSV column mapping)' },
        { n: 47, app: 'P', cat: 'Check-in flow', title: 'Localization / Spanish dashboard and label UI' },
        { n: 48, app: 'P', cat: 'Check-in flow', title: 'Checkout screen with guardian + authorized-pickup matching' },
        { n: 49, app: 'P', cat: 'Check-in flow', title: 'Live "who\'s still here" board as kids check out' },
        { n: 50, app: 'P', cat: 'Check-in flow', title: 'Configurable late-grace per club instead of one global value' },

        // Screen themes & effects — Display
        { n: 51, app: 'D', cat: 'Screen themes & effects', title: 'More seasonal skins (Thanksgiving, Easter, VBS, back-to-school)' },
        { n: 52, app: 'D', cat: 'Screen themes & effects', title: 'Custom theme builder (colors, shapes, motion) in the UI' },
        { n: 53, app: 'D', cat: 'Screen themes & effects', title: 'Per-club color pulled automatically from the Awana catalog' },
        { n: 54, app: 'D', cat: 'Screen themes & effects', title: 'Confetti / effect intensity configurable per event type' },
        { n: 55, app: 'D', cat: 'Screen themes & effects', title: 'Selectable sound packs for check-in chimes' },
        { n: 56, app: 'D', cat: 'Screen themes & effects', title: 'Looping video background support' },
        { n: 57, app: 'D', cat: 'Screen themes & effects', title: 'Rotate through multiple slideshow sources' },
        { n: 58, app: 'D', cat: 'Screen themes & effects', title: 'Snow / rain / sparkle particle toggles' },
        { n: 59, app: 'D', cat: 'Screen themes & effects', title: 'Weather-driven theme (rainy night = cozy palette)' },
        { n: 60, app: 'D', cat: 'Screen themes & effects', title: 'Custom church logo upload for the stage' },

        // Screen content & data — Display
        { n: 61, app: 'D', cat: 'Screen content & data', title: 'Live attendance goal thermometer ("42 of 60 checked in")' },
        { n: 62, app: 'D', cat: 'Screen content & data', title: 'Points-race animation between color teams' },
        { n: 63, app: 'D', cat: 'Screen content & data', title: 'Milestone celebrations (100th check-in of the night)' },
        { n: 64, app: 'D', cat: 'Screen content & data', title: 'Upgraded birthday shout-out animations' },
        { n: 65, app: 'D', cat: 'Screen content & data', title: 'Verse-of-the-week auto-rotation' },
        { n: 66, app: 'D', cat: 'Screen content & data', title: 'Announcement ticker editor with scheduling' },
        { n: 67, app: 'D', cat: 'Screen content & data', title: 'Emergency / lockdown full-screen takeover message' },
        { n: 68, app: 'D', cat: 'Screen content & data', title: 'Attendance leaderboard by club' },
        { n: 69, app: 'D', cat: 'Screen content & data', title: '"Now serving" club rotation for game-time screens' },
        { n: 70, app: 'D', cat: 'Screen content & data', title: 'Attendance-history sparkline on screen' },
        { n: 71, app: 'D', cat: 'Screen content & data', title: 'Sponsor / thank-you slide rotation' },
        { n: 72, app: 'D', cat: 'Screen content & data', title: 'Photo slideshow from the event, gated on consent' },

        // Screen operations & a11y — Display
        { n: 73, app: 'D', cat: 'Screen operations & accessibility', title: 'Multi-screen sync (lobby + gym stay in lockstep)' },
        { n: 74, app: 'D', cat: 'Screen operations & accessibility', title: 'Presentation remote control from a phone' },
        { n: 75, app: 'D', cat: 'Screen operations & accessibility', title: 'On-screen QR to join phone check-in' },
        { n: 76, app: 'D', cat: 'Screen operations & accessibility', title: 'Idle screensaver mode with configurable timeout' },
        { n: 77, app: 'D', cat: 'Screen operations & accessibility', title: 'High-contrast accessibility mode' },
        { n: 78, app: 'D', cat: 'Screen operations & accessibility', title: 'Reduced-motion toggle honoring the OS setting' },
        { n: 79, app: 'D', cat: 'Screen operations & accessibility', title: 'Text-to-speech welcome for the named child' },
        { n: 80, app: 'D', cat: 'Screen operations & accessibility', title: 'Keyboard-shortcut cheat-sheet overlay' },
        { n: 81, app: 'D', cat: 'Screen operations & accessibility', title: 'Selectable wall-clock styles' },
        { n: 82, app: 'D', cat: 'Screen operations & accessibility', title: 'Auto-detect no-club nights from the schedule and show a rest screen' },
        { n: 83, app: 'D', cat: 'Screen operations & accessibility', title: 'Countdown-target editor UI (no code)' },
        { n: 84, app: 'D', cat: 'Screen operations & accessibility', title: 'Wake-lock status indicator with a nudge if it fails' },

        // Cross-app / platform — Both
        { n: 85,  app: 'B', cat: 'Cross-app / platform', title: 'Shared theme sync so printer labels and the screen match' },
        { n: 86,  app: 'B', cat: 'Cross-app / platform', title: 'One config dashboard that manages both apps' },
        { n: 87,  app: 'B', cat: 'Cross-app / platform', title: 'A single unified church-config file both apps read' },
        { n: 88,  app: 'B', cat: 'Cross-app / platform', title: 'Combined "night status" health page for both apps' },
        { n: 89,  app: 'B', cat: 'Cross-app / platform', title: 'Cross-app event-contract version indicator / mismatch warning' },
        { n: 90,  app: 'B', cat: 'Cross-app / platform', title: 'Combined analytics across prints and screen events' },
        { n: 91,  app: 'B', cat: 'Cross-app / platform', title: 'One-click "start club night" that arms the server and the screens' },
        { n: 92,  app: 'B', cat: 'Cross-app / platform', title: 'Shared birthday feed consumed by both apps' },
        { n: 93,  app: 'B', cat: 'Cross-app / platform', title: 'New-church onboarding wizard covering both installs' },
        { n: 94,  app: 'B', cat: 'Cross-app / platform', title: 'Demo / sandbox mode with fake data for volunteer training' },
        { n: 95,  app: 'B', cat: 'Cross-app / platform', title: 'Shared design-token file (colors, timings) versioned across repos' },
        { n: 96,  app: 'B', cat: 'Cross-app / platform', title: 'Unified release notes page pulling both changelogs' },
        { n: 97,  app: 'B', cat: 'Cross-app / platform', title: 'Single "panic mode" that calms both the screen and the printer' },
        { n: 98,  app: 'B', cat: 'Cross-app / platform', title: 'Shared incident log (print failures + screen disconnects) in one view' },
        { n: 99,  app: 'B', cat: 'Cross-app / platform', title: 'Cross-app feature-flag panel' },
        { n: 100, app: 'B', cat: 'Cross-app / platform', title: 'End-to-end smoke test that exercises check-in → label → screen banner' },
      ];

      var APP_NAME = { P: 'Printer', D: 'Display', B: 'Both' };

      // ── State (in-memory only; resets on reload, by design) ─────────────────
      var checked = new Set();
      var filter = 'all';
      var query = '';

      var listEl = document.getElementById('list');
      var searchEl = document.getElementById('search');
      var selectedCountEl = document.getElementById('selected-count');
      var copyBtn = document.getElementById('copy-btn');
      var emptyNoteEl = document.getElementById('empty-note');

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      function matchesFilter(idea) {
        if (filter !== 'all' && idea.app !== filter) return false;
        if (query && idea.title.toLowerCase().indexOf(query) === -1) return false;
        return true;
      }

      function visibleIdeas() { return IDEAS.filter(matchesFilter); }

      function render() {
        var groups = [];
        var byCat = {};
        visibleIdeas().forEach(function (idea) {
          if (!byCat[idea.cat]) { byCat[idea.cat] = []; groups.push(idea.cat); }
          byCat[idea.cat].push(idea);
        });

        if (!groups.length) {
          listEl.innerHTML = '<p class="text-sm text-slate-400 py-8 text-center">No ideas match your filter.</p>';
        } else {
          listEl.innerHTML = groups.map(function (cat) {
            var rows = byCat[cat].map(function (idea) {
              var on = checked.has(idea.n);
              return '<label class="idea-row ' + (on ? 'checked' : '') + '" data-n="' + idea.n + '">' +
                '<input type="checkbox" ' + (on ? 'checked' : '') + ' data-n="' + idea.n + '">' +
                '<span class="tag tag-' + idea.app + '">' + idea.app + '</span>' +
                '<span class="text-sm text-slate-700"><span class="text-slate-400 tabular-nums">' + idea.n + '.</span> ' + esc(idea.title) + '</span>' +
                '</label>';
            }).join('');
            return '<section>' +
              '<h2 class="text-xs font-bold uppercase tracking-wide text-slate-400 mb-1.5">' + esc(cat) + '</h2>' +
              '<div class="bg-white rounded-xl border border-slate-200 p-1.5">' + rows + '</div>' +
              '</section>';
          }).join('');
        }
        updateCounts();
      }

      function updateCounts() {
        selectedCountEl.textContent = String(checked.size);
        copyBtn.disabled = checked.size === 0;
        emptyNoteEl.textContent = checked.size === 0 ? 'Nothing selected yet.' : '';
        // Per-filter counts on the chips.
        var counts = { all: IDEAS.length, P: 0, D: 0, B: 0 };
        IDEAS.forEach(function (i) { counts[i.app]++; });
        document.querySelectorAll('.chip-count').forEach(function (el) {
          var key = el.getAttribute('data-count');
          el.textContent = '(' + counts[key] + ')';
        });
      }

      // Toggle via change event (covers keyboard + click on the row's label).
      listEl.addEventListener('change', function (e) {
        var cb = e.target;
        if (!cb || cb.type !== 'checkbox') return;
        var n = Number(cb.getAttribute('data-n'));
        if (cb.checked) checked.add(n); else checked.delete(n);
        var row = cb.closest('.idea-row');
        if (row) row.classList.toggle('checked', cb.checked);
        updateCounts();
      });

      // Filter chips.
      document.getElementById('filter-chips').addEventListener('click', function (e) {
        var btn = e.target.closest('button[data-filter]');
        if (!btn) return;
        filter = btn.getAttribute('data-filter');
        document.querySelectorAll('#filter-chips .chip').forEach(function (c) { c.classList.remove('chip-active'); });
        btn.classList.add('chip-active');
        render();
      });

      // Search.
      searchEl.addEventListener('input', function () {
        query = searchEl.value.trim().toLowerCase();
        render();
      });

      // Select all visible / clear.
      document.getElementById('select-visible').addEventListener('click', function () {
        visibleIdeas().forEach(function (i) { checked.add(i.n); });
        render();
      });
      document.getElementById('clear-all').addEventListener('click', function () {
        checked.clear();
        render();
      });

      // ── Build the prompt from the checked ideas only ────────────────────────
      function buildPrompt() {
        var picked = IDEAS.filter(function (i) { return checked.has(i.n); });
        var lines = [];
        lines.push('I want to build the following features across my two Awana apps:');
        lines.push('the label printer (github.com/patrick-simpson/Print-TwoTimTwo-Labels)');
        lines.push('and the check-in display (github.com/patrick-simpson/Awana-Check-in-Display).');
        lines.push('');
        lines.push('Each feature is tagged [Printer], [Display], or [Both].');
        lines.push('For each one, propose an implementation approach before writing code,');
        lines.push('and flag anything that touches the privacy/security invariants.');
        lines.push('');
        picked.forEach(function (i, idx) {
          lines.push((idx + 1) + '. [' + APP_NAME[i.app] + '] ' + i.title);
        });
        return lines.join('\n');
      }

      copyBtn.addEventListener('click', function () {
        if (checked.size === 0) return;
        var text = buildPrompt();
        var done = function () {
          var orig = copyBtn.textContent;
          copyBtn.textContent = 'Copied ✓';
          setTimeout(function () { copyBtn.textContent = orig; }, 1600);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text, done); });
        } else {
          fallbackCopy(text, done);
        }
      });

      function fallbackCopy(text, done) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); done(); }
        catch (e) { window.prompt('Copy the prompt below:', text); }
        document.body.removeChild(ta);
      }

      render();
    </script>
  </body>
</html>
